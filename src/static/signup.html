<style>
  :root {
    --bg: #030014;
    --surface: rgba(24, 24, 27, 0.4);
    --border: rgba(255, 255, 255, 0.08);
    --border-focus: rgba(168, 85, 247, 0.5);
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --accent: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    --accent-text: #ffffff;
    --danger: #ef4444;
  }

  :root[data-theme="light"] {
    --bg: #f8fafc;
    --surface: rgba(255, 255, 255, 0.7);
    --border: rgba(0, 0, 0, 0.08);
    --border-focus: rgba(168, 85, 247, 0.5);
    --text: #0f172a;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html {
    background-color: var(--bg);
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: transparent; /* Allow LaserFlow to show through */
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 2rem 1.5rem;
  }

  /* Aurora Background */
  .aurora-bg {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -2;
    overflow: hidden;
    background: var(--bg);
  }
  .aurora-blob {
    position: absolute;
    filter: blur(100px);
    opacity: 0.5;
    animation: float 20s infinite ease-in-out alternate;
    border-radius: 50%;
  }
  .aurora-blob:nth-child(1) {
    top: -10%; left: -10%; width: 50vw; height: 50vw;
    background: #6366f1;
    animation-delay: 0s;
  }
  .aurora-blob:nth-child(2) {
    bottom: -20%; right: -10%; width: 60vw; height: 60vw;
    background: #a855f7;
    animation-delay: -5s;
  }
  .aurora-blob:nth-child(3) {
    top: 40%; left: 50%; width: 40vw; height: 40vw;
    background: #ec4899;
    animation-delay: -10s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -50px) scale(1.1); }
    66% { transform: translate(-20px, 20px) scale(0.9); }
    100% { transform: translate(0, 0) scale(1); }
  }

  /* Grid overlay */
  .bg-grid {
    position: fixed; inset: 0; z-index: -1;
    background-image: 
      linear-gradient(to right, var(--border) 1px, transparent 1px),
      linear-gradient(to bottom, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
  }

  .brand {
    display: flex; flex-direction: column; align-items: center;
    gap: 0.75rem; margin-bottom: 2rem;
    animation: fadeDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .brand-icon {
    width: 64px; height: 64px; border-radius: 16px;
    object-fit: cover;
    box-shadow: 0 10px 30px -5px rgba(168,85,247,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    background: transparent;
  }

  .brand-name {
    font-family: 'Outfit', sans-serif;
    font-size: 1.8rem; font-weight: 700; letter-spacing: -0.04em;
    background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-card {
    background: var(--surface);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 2.5rem; width: 100%; max-width: 420px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }
  
  .auth-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 24px; padding: 1px;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-header { text-align: center; margin-bottom: 2rem; }
  .auth-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.6rem; font-weight: 600; margin-bottom: 0.5rem;
    color: var(--text);
  }
  .auth-sub { color: var(--text-muted); font-size: 0.95rem; }

  .field { margin-bottom: 1.25rem; }
  .field label {
    display: block; font-size: 0.75rem; font-weight: 600;
    color: var(--text-muted); margin-bottom: 0.5rem;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  
  .input-wrapper { position: relative; }
  
  .field input {
    width: 100%; padding: 0.875rem 1rem 0.875rem 2.75rem;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); font-size: 0.95rem; font-family: inherit;
    transition: all 0.3s ease;
  }
  
  :root[data-theme="light"] .field input { background: rgba(255,255,255,0.5); }

  .field input:focus {
    outline: none; border-color: var(--border-focus); background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.15);
  }

  .field-icon {
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); transition: color 0.3s;
  }
  .field:focus-within .field-icon { color: #a855f7; }

  .btn-submit {
    width: 100%; padding: 0.875rem; border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 600; background: var(--accent); color: var(--accent-text);
    cursor: pointer; transition: all 0.3s ease;
    display: flex; justify-content: center; align-items: center; gap: 0.5rem;
    position: relative; overflow: hidden; margin-top: 0.5rem;
  }
  
  .btn-submit::before {
    content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: 0.5s;
  }
  .btn-submit:hover::before { left: 100%; }
  
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(168,85,247,0.8); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; filter: saturate(0.5); }

  .btn-google {
    width: 100%; padding: 0.875rem; border: 1px solid var(--border); border-radius: 12px;
    background: rgba(255,255,255,0.02); color: var(--text);
    font-size: 0.95rem; font-weight: 500; font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 0.75rem;
    cursor: pointer; transition: all 0.3s ease; margin-bottom: 1rem;
  }
  .btn-google:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }

  .divider {
    display: flex; align-items: center; gap: 1rem; margin: 1.5rem 0;
    color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .forgot-link {
    display: block; text-align: right; font-size: 0.8rem; color: var(--text-muted);
    text-decoration: none; margin-top: -0.5rem; margin-bottom: 1.5rem; transition: color 0.2s;
  }
  .forgot-link:hover { color: #a855f7; }

  .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
  .auth-footer a { color: #a855f7; text-decoration: none; font-weight: 500; transition: color 0.2s; }
  .auth-footer a:hover { color: #c084fc; text-decoration: underline; }

  .theme-pill {
    position: fixed; top: 1.5rem; right: 1.5rem; padding: 0.5rem 1rem; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 0.8rem; font-weight: 500; cursor: pointer;
    backdrop-filter: blur(12px); transition: all 0.2s; z-index: 50;
  }
  .theme-pill:hover { border-color: var(--border-focus); transform: scale(1.05); }

  .error-box {
    background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 12px; padding: 0.875rem; font-size: 0.85rem; color: var(--danger);
    margin-bottom: 1rem; display: none; animation: fadeUp 0.3s ease; text-align: center;
  }
  
  .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); border-top-color: currentColor; animation: spin 0.6s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Signup specific */
  .pw-strength { margin-top: 0.5rem; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .pw-strength-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease, background 0.4s ease; width: 0%; }
  .pw-hint { font-size: 0.75rem; font-weight: 500; color: var(--text-muted); margin-top: 0.4rem; display: flex; align-items: center; gap: 0.25rem; }
  
  .terms-agreement { margin: 1.25rem 0; display: flex; align-items: center; }
  .custom-checkbox { display: flex; align-items: center; position: relative; padding-left: 28px; cursor: pointer; font-size: 0.8rem; color: var(--text-muted); user-select: none; }
  .custom-checkbox input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
  .checkmark { position: absolute; top: 50%; left: 0; transform: translateY(-50%); height: 18px; width: 18px; background-color: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px; transition: all 0.2s; }
  .custom-checkbox:hover input ~ .checkmark { border-color: var(--border-focus); }
  .custom-checkbox input:checked ~ .checkmark { background: #a855f7; border-color: transparent; box-shadow: 0 0 10px rgba(168,85,247,0.4); }
  .checkmark:after { content: ""; position: absolute; display: none; left: 6px; top: 2.5px; width: 4px; height: 8px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .custom-checkbox input:checked ~ .checkmark:after { display: block; }
  .custom-checkbox a { color: var(--text); text-decoration: underline; font-weight: 500; transition: color 0.2s; }
  .custom-checkbox a:hover { color: #a855f7; }
</style>

</head>

<button class="theme-pill" onclick="toggleTheme()" id="theme-btn">🌙 Dark</button>

<div class="brand">

<div class="auth-card">
  <div class="animate-stagger">
    <div class="auth-header">

    </div>

    <!-- Google Sign-Up -->
    <button class="btn-google" id="google-btn" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>

<script>




// Theme toggle for signup page
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = next === 'dark' ? '🌙 Dark' : '☀️ Light';
}
// Sync button label on load
(function(){
  const t = document.documentElement.getAttribute('data-theme') || 'dark';
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = t === 'dark' ? '🌙 Dark' : '☀️ Light';
})();

function toggleSubmitBtn() {
  const agreed = document.getElementById('agree-terms').checked;
  document.getElementById('btn-submit').disabled = !agreed;
}

// ── Google OAuth Logic ────────────────────────────
async function handleGoogleLogin() {
  try {
    const r = await fetch('/auth/google', {method: 'HEAD', redirect: 'manual'});
    if (r.status === 503) {
      document.getElementById('error-text').innerHTML = 'Google Sign-Up is not configured yet. Please add your <strong>GOOGLE_CLIENT_ID</strong> and <strong>GOOGLE_CLIENT_SECRET</strong> to the <code>.env</code> file.';
      document.getElementById('error-box').style.display = 'block';
    } else {
      window.location.href = '/auth/google';
    }
  } catch (err) {
    window.location.href = '/auth/google';
  }
}

// ── Password strength ─────────────────────────
function checkStrength(pw){
  const bar = document.getElementById('pw-bar');
  const hint = document.getElementById('pw-hint');
  let score = 0;
  if(pw.length >= 8) score++;
  if(pw.length >= 12) score++;
  if(/[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;

  const pct = Math.round((score/5)*100);
  bar.style.width = pct + '%';
  if(score <= 1){ bar.style.background='#ef4444'; hint.textContent='Weak password'; }
  else if(score <= 3){ bar.style.background='#f59e0b'; hint.textContent='Fair password'; }
  else if(score === 4){ bar.style.background='#22c55e'; hint.textContent='Strong password'; }
  else { bar.style.background='#a855f7'; hint.textContent='Very strong password ✨'; }
}

// ── Sign-up form ──────────────────────────────
document.getElementById('signup-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn     = document.getElementById('btn-submit');
  const spin    = document.getElementById('spin');
  const text    = document.getElementById('btn-text');
  const errBox  = document.getElementById('error-box');
  const errTxt  = document.getElementById('error-text');

  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pw    = document.getElementById('password').value;

  if(!name){ errTxt.textContent='Please enter your name.'; errBox.style.display='block'; return; }
  if(!email){ errTxt.textContent='Please enter your email.'; errBox.style.display='block'; return; }
  if(pw.length < 8){ errTxt.textContent='Password must be at least 8 characters.'; errBox.style.display='block'; return; }

  btn.disabled=true; spin.style.display='block'; text.textContent='Creating account…';
  errBox.style.display='none';

  const data = new FormData();
  data.append('name', name);
  data.append('email', email);
  data.append('password', pw);

  try {
    const res  = await fetch('/auth/signup', {method:'POST', body:data});
    const json = await res.json();
    if(json.ok){
      text.textContent='✓ Account created!';
      setTimeout(()=>window.location.href='/', 350);
    } else {
      errTxt.textContent = json.error || 'Sign-up failed.';
      errBox.style.display='block';
      btn.disabled=false; spin.style.display='none'; text.textContent='Create Account';
    }
  } catch {
    errTxt.textContent='Network error. Please try again.';
    errBox.style.display='block';
    btn.disabled=false; spin.style.display='none'; text.textContent='Create Account';
  }
});
</script>

<script type="module">
import { Renderer, Program, Mesh, Triangle } from 'ogl';

const hexToRgb = hex => {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!result) return [1, 0.5, 0.2];
  return [parseInt(result[1], 16) / 255, parseInt(result[2], 16) / 255, parseInt(result[3], 16) / 255];
};

const vertex = `#version 300 es
precision highp float;
in vec2 position;
in vec2 uv;
out vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragment = `#version 300 es
precision highp float;
uniform vec2 iResolution;
uniform float iTime;
uniform vec3 uCustomColor;
uniform float uUseCustomColor;
uniform float uSpeed;
uniform float uDirection;
uniform float uScale;
uniform float uOpacity;
uniform vec2 uMouse;
uniform float uMouseInteractive;
out vec4 fragColor;

void mainImage(out vec4 o, vec2 C) {
  vec2 center = iResolution.xy * 0.5;
  C = (C - center) / uScale + center;
  
  vec2 mouseOffset = (uMouse - center) * 0.0002;
  C += mouseOffset * length(C - center) * step(0.5, uMouseInteractive);
  
  float i, d, z, T = iTime * uSpeed * uDirection;
  vec3 O, p, S;

  for (vec2 r = iResolution.xy, Q; ++i < 60.; O += o.w/d*o.xyz) {
    p = z*normalize(vec3(C-.5*r,r.y)); 
    p.z -= 4.; 
    S = p;
    d = p.y-T;
    
    p.x += .4*(1.+p.y)*sin(d + p.x*0.1)*cos(.34*d + p.x*0.05); 
    Q = p.xz *= mat2(cos(p.y+vec4(0,11,33,0)-T)); 
    z+= d = abs(sqrt(length(Q*Q)) - .25*(5.+S.y))/3.+8e-4; 
    o = 1.+sin(S.y+p.z*.5+S.z-length(S-p)+vec4(2,1,0,8));
  }
  
  o.xyz = tanh(O/1e4);
}

bool finite1(float x){ return !(isnan(x) || isinf(x)); }
vec3 sanitize(vec3 c){
  return vec3(
    finite1(c.r) ? c.r : 0.0,
    finite1(c.g) ? c.g : 0.0,
    finite1(c.b) ? c.b : 0.0
  );
}

void main() {
  vec4 o = vec4(0.0);
  mainImage(o, gl_FragCoord.xy);
  vec3 rgb = sanitize(o.rgb);
  
  float intensity = (rgb.r + rgb.g + rgb.b) / 3.0;
  vec3 customColor = intensity * uCustomColor;
  vec3 finalColor = mix(rgb, customColor, step(0.5, uUseCustomColor));
  
  float alpha = length(rgb) * uOpacity;
  fragColor = vec4(finalColor, alpha);
}`;

const color = '#a855f7'; // Purple accent from UI
const speed = 0.6;
const direction = 'forward';
const scale = 1.1;
const opacity = 0.8;
const mouseInteractive = true;

const containerEl = document.getElementById('plasma-container');
if (containerEl) {
    const mousePos = { x: 0, y: 0 };
    const useCustomColor = color ? 1.0 : 0.0;
    const customColorRgb = color ? hexToRgb(color) : [1, 1, 1];
    const directionMultiplier = direction === 'reverse' ? -1.0 : 1.0;

    let renderer;
    try {
      renderer = new Renderer({
        webgl: 2,
        alpha: true,
        antialias: false,
        dpr: Math.min(window.devicePixelRatio || 1, 2)
      });
    } catch (e) {
      console.error(e);
    }

    if (renderer) {
        const gl = renderer.gl;
        const canvas = gl.canvas;
        canvas.style.display = 'block';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        containerEl.appendChild(canvas);

        const geometry = new Triangle(gl);

        const program = new Program(gl, {
          vertex: vertex,
          fragment: fragment,
          uniforms: {
            iTime: { value: 0 },
            iResolution: { value: new Float32Array([1, 1]) },
            uCustomColor: { value: new Float32Array(customColorRgb) },
            uUseCustomColor: { value: useCustomColor },
            uSpeed: { value: speed * 0.4 },
            uDirection: { value: directionMultiplier },
            uScale: { value: scale },
            uOpacity: { value: opacity },
            uMouse: { value: new Float32Array([0, 0]) },
            uMouseInteractive: { value: mouseInteractive ? 1.0 : 0.0 }
          }
        });

        const mesh = new Mesh(gl, { geometry, program });

        const handleMouseMove = e => {
          if (!mouseInteractive) return;
          const rect = containerEl.getBoundingClientRect();
          mousePos.x = e.clientX - rect.left;
          mousePos.y = e.clientY - rect.top;
          const mouseUniform = program.uniforms.uMouse.value;
          mouseUniform[0] = mousePos.x;
          mouseUniform[1] = mousePos.y;
        };

        if (mouseInteractive) {
          containerEl.addEventListener('mousemove', handleMouseMove);
        }

        const setSize = () => {
          const rect = containerEl.getBoundingClientRect();
          const width = Math.max(1, Math.floor(rect.width));
          const height = Math.max(1, Math.floor(rect.height));
          renderer.setSize(width, height);
          const res = program.uniforms.iResolution.value;
          res[0] = gl.drawingBufferWidth;
          res[1] = gl.drawingBufferHeight;
        };

        const ro = new ResizeObserver(setSize);
        ro.observe(containerEl);
        setSize();

        let raf = 0;
        let contextLost = false;
        let isVisible = true;
        const t0 = performance.now();

        const loop = t => {
          if (contextLost || !isVisible) return;
          let timeValue = (t - t0) * 0.001;
          if (direction === 'pingpong') {
            const pingpongDuration = 10;
            const segmentTime = timeValue % pingpongDuration;
            const isForward = Math.floor(timeValue / pingpongDuration) % 2 === 0;
            const u = segmentTime / pingpongDuration;
            const smooth = u * u * (3 - 2 * u);
            const pingpongTime = isForward ? smooth * pingpongDuration : (1 - smooth) * pingpongDuration;
            program.uniforms.uDirection.value = 1.0;
            program.uniforms.iTime.value = pingpongTime;
          } else {
            program.uniforms.iTime.value = timeValue;
          }
          renderer.render({ scene: mesh });
          raf = requestAnimationFrame(loop);
        };

        const handleContextLost = (e) => {
          e.preventDefault();
          contextLost = true;
          cancelAnimationFrame(raf);
        };
        const handleContextRestored = () => {
          contextLost = false;
          if (isVisible) {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(loop);
          }
        };
        canvas.addEventListener('webglcontextlost', handleContextLost);
        canvas.addEventListener('webglcontextrestored', handleContextRestored);

        const io = new IntersectionObserver(([entry]) => {
          const wasVisible = isVisible;
          isVisible = entry.isIntersecting;
          if (isVisible && !wasVisible && !contextLost) {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(loop);
          }
        }, { threshold: 0 });
        io.observe(containerEl);

        raf = requestAnimationFrame(loop);
    }
}
</script>
</body>
</html>
